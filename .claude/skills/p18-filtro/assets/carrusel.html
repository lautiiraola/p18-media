<!doctype html><html><head><meta charset="utf-8"><style>
/* Filtro carrusel P18: slide de video para carrusel, 1080x1350 (4:5, igual que el resto del carrusel, así Instagram
   no recorta nada) con el video en un recuadro 1:1. Mismo estilo que las piezas del carrusel (p18-contenido/pieza.html):
   fondo plano oscuro | lima | papel con textura, etiqueta de área, título grande, P18 abajo.
   Query: fondo, area, t (título, *clave*), src (crédito), top, s (lado del recuadro). */
@font-face{font-family:M;src:url(Manrope-500.ttf);font-weight:500}
@font-face{font-family:M;src:url(Manrope-700.ttf);font-weight:700}
@font-face{font-family:M;src:url(Manrope-800.ttf);font-weight:800}
:root{--lime:#C2F542;--ink:#172019;--paper:#F5F5EB;--deep:#14251D}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;font-family:M;overflow:hidden}
body{background:var(--bg);color:var(--fg)}
.oscuro{--bg:var(--deep);--fg:var(--lime);--tx:var(--paper);--tagbg:var(--lime);--tagfg:var(--ink);--line:var(--lime)}
.lima{--bg:var(--lime);--fg:var(--ink);--tx:var(--ink);--tagbg:var(--ink);--tagfg:var(--lime);--line:var(--ink)}
.papel{--bg:var(--paper);--fg:var(--ink);--tx:var(--ink);--tagbg:var(--lime);--tagfg:var(--ink);--line:var(--ink)}
.deco{position:absolute;inset:0;overflow:hidden}
.dots{position:absolute;inset:0;background:radial-gradient(color-mix(in srgb,var(--fg) 22%,transparent) 2px,transparent 2.4px) 0 0/34px 34px;-webkit-mask:linear-gradient(160deg,transparent 30%,#000 75%);mask:linear-gradient(160deg,transparent 30%,#000 75%)}
.big{position:absolute;right:-90px;bottom:-140px;font-weight:800;font-size:760px;line-height:.8;letter-spacing:-40px;color:transparent;-webkit-text-stroke:4px color-mix(in srgb,var(--fg) 26%,transparent)}
.ring{position:absolute;left:-220px;bottom:-260px;width:620px;height:620px;border-radius:50%;border:4px solid color-mix(in srgb,var(--fg) 20%,transparent)}
.tag{position:absolute;top:56px;left:100px;background:var(--tagbg);color:var(--tagfg);font-weight:800;font-size:26px;letter-spacing:2px;text-transform:uppercase;padding:7px 15px;z-index:3}
.box{position:absolute;border-radius:28px;outline:4px solid var(--line);outline-offset:7px;background:#0d1712;z-index:2}
.title{position:absolute;left:100px;right:100px;color:var(--fg);font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-1.5px;text-wrap:balance;z-index:3}
.title b{font-weight:800}
.oscuro .title b{color:var(--paper)}
.lima .title b,.papel .title b{text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:.18em;text-decoration-color:var(--tagbg);text-decoration-skip-ink:all}
.pie{position:absolute;left:100px;right:100px;bottom:50px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;z-index:3}
.pie .logo{font-weight:800;font-size:52px;color:var(--fg);letter-spacing:-1px;line-height:1}
.pie .src{font-weight:700;font-size:22px;letter-spacing:1px;text-transform:uppercase;color:var(--tx);opacity:.7;text-align:right;padding-bottom:6px}
</style></head><body>
<div class="deco"><div class="dots"></div><div class="ring"></div><div class="big">18</div></div>
<div class="tag" id="tag"></div>
<div class="box" id="box"></div>
<div class="title" id="title"></div>
<div class="pie"><span class="logo">P18</span><span class="src" id="src"></span></div>
<script>
const q=new URLSearchParams(location.search);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.body.className=q.get('fondo')||'oscuro';
const tg=document.getElementById('tag');q.get('area')?tg.textContent=q.get('area'):tg.remove();
const bt=+(q.get('top')||130),s=+(q.get('s')||880),left=(1080-s)/2;
const box=document.getElementById('box');Object.assign(box.style,{top:bt+'px',left:left+'px',width:s+'px',height:s+'px'});
const ti=document.getElementById('title');
ti.innerHTML=esc(q.get('t')||'').replace(/\*(.+?)\*/g,'<b>$1</b>');
ti.style.top=(bt+s+44)+'px';
// el título entra en 2 renglones; si no, achica (mín. 44px)
let fs=60;while(fs>44&&ti.offsetHeight>fs*1.02*2+4){fs-=2;ti.style.fontSize=fs+'px'}
document.getElementById('src').textContent=q.get('src')?('Fuente: '+q.get('src')):'';
const pieTop=document.querySelector('.pie').offsetTop;
window.P18={left,top:bt,s,fontSize:fs,desborda:ti.offsetTop+ti.offsetHeight>pieTop-16};
</script></body></html>
