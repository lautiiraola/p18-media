<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P18 Publisher for TikTok</title>
<style>
:root{--lima:#C2F542;--tinta:#172019;--papel:#F5F5EB;--prof:#14251D;--line:rgba(245,245,235,.14);--mute:rgba(245,245,235,.66);--bad:#F08C7A}
*{box-sizing:border-box}
body{margin:0;background:var(--prof);color:var(--papel);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line)}
header .marca{display:flex;align-items:center;gap:12px;font-weight:800}
header .marca img{height:28px}
.cuenta{display:flex;align-items:center;gap:10px;font-size:14px}
.cuenta img{width:34px;height:34px;border-radius:50%;background:#000}
.cuenta small{display:block;color:var(--mute)}
a{color:var(--lima)}
button{font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--lima);background:var(--lima);color:var(--tinta)}
button.ghost{background:transparent;color:var(--papel);border-color:var(--line);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 67px)}
aside{border-right:1px solid var(--line);padding:16px;display:grid;gap:8px;align-content:start}
aside h2,section h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lima);margin:4px 0 8px}
.item{display:grid;gap:2px;text-align:left;background:var(--tinta);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--papel);font-weight:600;cursor:pointer}
.item small{color:var(--mute);font-weight:500}
.item[aria-current="true"]{border-color:var(--lima)}
.item.hecho{opacity:.5}
section{padding:24px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-content:start}
video{width:100%;aspect-ratio:9/16;background:#000;border-radius:14px}
.campos{display:grid;gap:18px;align-content:start;max-width:560px}
label.t{display:grid;gap:6px;font-weight:700}
textarea,select{font:inherit;background:var(--tinta);color:var(--papel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
.fila{display:flex;flex-wrap:wrap;gap:18px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--lima)}
.chk.off{opacity:.45}
.nota{color:var(--mute);font-size:13px}
.caja{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.etq{background:rgba(194,245,66,.12);border:1px solid var(--lima);color:var(--lima);border-radius:10px;padding:8px 12px;font-size:14px}
.legal{font-size:13px;color:var(--mute)}
.msg{padding:12px 14px;border-radius:10px;background:var(--tinta);border:1px solid var(--line)}
.msg.err{border-color:var(--bad);color:var(--bad)}
.vacio{grid-column:1/-1;color:var(--mute);padding:40px;text-align:center}
.inicio{display:grid;place-items:center;align-content:center;min-height:calc(100vh - 67px);text-align:center;gap:16px;padding:24px}
.inicio h1{font-size:34px;margin:0}
@media (max-width:860px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}section{grid-template-columns:1fr}}
</style></head>
<body>
<header>
  <div class="marca"><img src="/logo.svg" alt="P18"> Publisher for TikTok</div>
  <div class="cuenta" id="cuenta"></div>
</header>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRIV={PUBLIC_TO_EVERYONE:"Everyone",MUTUAL_FOLLOW_FRIENDS:"Friends",FOLLOWER_OF_CREATOR:"Followers",SELF_ONLY:"Only me"};
let creador=null, cola=[], actual=null, hechos=new Set();

async function iniciar(){
  const r=await (await fetch("/api/creador")).json();
  if(!r.conectado){
    $("#cuenta").innerHTML="";
    $("#app").innerHTML=`<div class="inicio"><img src="/logo.svg" alt="P18" style="height:56px"><h1>P18 Publisher for TikTok</h1>
      <p class="nota">Review the videos prepared by the P18 team and publish them to your TikTok account.</p>
      <a href="/login"><button>Continue with TikTok</button></a></div>`;return}
  if(r.error&&r.error.code&&r.error.code!=="ok"){$("#app").innerHTML=`<div class="inicio"><p class="msg err">This account can't post right now (${esc(r.error.code)}). Please try again later.</p><a href="/logout"><button class="ghost">Log out</button></a></div>`;return}
  creador=r.data;
  $("#cuenta").innerHTML=`<img src="${esc(creador.creator_avatar_url)}" alt=""><div><b>${esc(creador.creator_nickname)}</b><small>Posting to @${esc(creador.creator_username)}</small></div><a href="/logout"><button class="ghost">Log out</button></a>`;
  cola=await (await fetch("/api/cola")).json();
  pintar();
}

function pintar(){
  if(!cola.length){$("#app").innerHTML=`<main><aside><h2>Queue</h2></aside><section><p class="vacio">No videos waiting to be published.</p></section></main>`;return}
  if(!actual)actual=cola[0].id;
  const it=cola.find(x=>x.id===actual);
  const max=creador.max_video_post_duration_sec, largo=max&&it.dur>max;
  const opc=(creador.privacy_level_options||[]).map(o=>`<option value="${o}">${PRIV[o]||o}</option>`).join("");
  const dis=k=>creador[k+"_disabled"]?"disabled":"";
  $("#app").innerHTML=`<main>
   <aside><h2>Queue (${cola.length})</h2>${cola.map(x=>`<button class="item${hechos.has(x.id)?" hecho":""}" aria-current="${x.id===actual}" data-id="${esc(x.id)}">${esc(x.titulo)}<small>${x.dur} s${hechos.has(x.id)?" · sent":""}</small></button>`).join("")}</aside>
   <section>
    <div><h2>Preview</h2>${it.existe?`<video src="/video/${encodeURIComponent(it.id)}" controls playsinline preload="metadata"></video>`:`<p class="msg err">Video file not found.</p>`}
      <p class="nota">${it.dur} s${max?` · max for this account: ${max} s`:""}</p>${largo?`<p class="msg err">This video is longer than this account allows.</p>`:""}</div>
    <form class="campos" id="f">
     <div class="nota">Posting to <b>${esc(creador.creator_nickname)}</b> (@${esc(creador.creator_username)})</div>
     <label class="t">Caption<textarea id="title" maxlength="2200">${esc(it.texto)}</textarea></label>
     <label class="t">Who can view this video
       <select id="priv" required><option value="" selected disabled>Select privacy</option>${opc}</select></label>
     <div><div class="t" style="font-weight:700;margin-bottom:8px">Allow users to</div>
      <div class="fila">
       <label class="chk ${dis("comment")?"off":""}"><input type="checkbox" id="comment" ${dis("comment")}> Comment</label>
       <label class="chk ${dis("duet")?"off":""}"><input type="checkbox" id="duet" ${dis("duet")}> Duet</label>
       <label class="chk ${dis("stitch")?"off":""}"><input type="checkbox" id="stitch" ${dis("stitch")}> Stitch</label>
      </div>${["comment","duet","stitch"].some(k=>creador[k+"_disabled"])?`<p class="nota">Some interactions are turned off in this account's TikTok settings.</p>`:""}</div>
     <div class="caja">
      <label class="switch">Disclose video content<input type="checkbox" id="com"></label>
      <p class="nota" style="margin:0">Turn on to disclose that this video promotes goods or services in exchange for something of value. Your video could promote yourself, a third party, or both.</p>
      <div id="opcom" hidden>
       <label class="chk"><input type="checkbox" id="org"> Your brand</label>
       <p class="nota" style="margin:0 0 8px 26px">You are promoting yourself or your own business.</p>
       <label class="chk" id="bclabel"><input type="checkbox" id="bc"> Branded content</label>
       <p class="nota" style="margin:0 0 0 26px">You are promoting another brand or a third party.</p>
       <p class="nota" id="hint" hidden>You need to indicate if your content promotes yourself, a third party, or both.</p>
      </div>
      <div class="etq" id="etq" hidden></div>
     </div>
     <p class="legal" id="legal"></p>
     <div id="out"></div>
     <button type="submit" id="pub" disabled>Publish</button>
    </form>
   </section></main>`;
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{actual=b.dataset.id;pintar()});
  ["priv","com","org","bc","comment","duet","stitch"].forEach(i=>$("#"+i).addEventListener("change",validar));
  $("#f").onsubmit=publicar; validar();
}

function validar(){
  const com=$("#com").checked, org=$("#org").checked, bc=$("#bc").checked, priv=$("#priv");
  $("#opcom").hidden=!com;
  // Branded content no puede ser privado
  const solo=[...priv.options].find(o=>o.value==="SELF_ONLY");
  if(solo){solo.disabled=com&&bc;solo.title=com&&bc?"Branded content visibility cannot be set to private.":""}
  if(com&&bc&&priv.value==="SELF_ONLY"){priv.value="";$("#out").innerHTML=`<p class="msg">Branded content visibility cannot be set to private. Please choose who can view this video.</p>`}
  $("#hint").hidden=!(com&&!org&&!bc);
  const etq=$("#etq");
  if(com&&(org||bc)){etq.hidden=false;etq.textContent=bc?"Your photo/video will be labeled as 'Paid partnership'":"Your photo/video will be labeled as 'Promotional content'"}else etq.hidden=true;
  const MUC='<a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>';
  const BCP='<a href="https://www.tiktok.com/legal/page/global/bc-policy/en" target="_blank" rel="noopener">Branded Content Policy</a>';
  $("#legal").innerHTML=com&&bc?`By posting, you agree to TikTok's ${BCP} and ${MUC}.`:`By posting, you agree to TikTok's ${MUC}.`;
  const it=cola.find(x=>x.id===actual), max=creador.max_video_post_duration_sec;
  $("#pub").disabled=!priv.value||(com&&!org&&!bc)||!it.existe||(max&&it.dur>max)||hechos.has(actual);
  $("#pub").title=com&&!org&&!bc?"You need to indicate if your content promotes yourself, a third party, or both.":"";
}

async function publicar(e){
  e.preventDefault();
  const b=$("#pub"); b.disabled=true; b.textContent="Uploading…";
  const body={id:actual,title:$("#title").value,privacy_level:$("#priv").value,comment:$("#comment").checked,duet:$("#duet").checked,
    stitch:$("#stitch").checked,brand_organic:$("#com").checked&&$("#org").checked,brand_content:$("#com").checked&&$("#bc").checked};
  const r=await fetch("/api/publicar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){$("#out").innerHTML=`<p class="msg err">${esc(d.error)}${d.detalle?` (${esc(d.detalle)})`:""}</p>`;b.textContent="Publish";validar();return}
  hechos.add(actual);
  $("#out").innerHTML=`<p class="msg">Sent to TikTok. It may take a few minutes for the content to process and be visible on your profile.<br><span id="st" class="nota">Status: processing…</span></p>`;
  b.textContent="Sent";
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,5000));
    const s=await (await fetch("/api/estado?id="+encodeURIComponent(d.publish_id))).json();
    const st=(s.data||{}).status||"PROCESSING";
    const txt={PROCESSING_UPLOAD:"uploading",PROCESSING_DOWNLOAD:"processing",SEND_TO_USER_INBOX:"sent to your TikTok inbox",PUBLISH_COMPLETE:"published",FAILED:"failed"}[st]||st.toLowerCase();
    if($("#st"))$("#st").textContent="Status: "+txt+(st==="FAILED"&&s.data.fail_reason?` (${s.data.fail_reason})`:"");
    if(st==="PUBLISH_COMPLETE"||st==="FAILED")break;
  }
}
iniciar();
</script>
</body></html>
